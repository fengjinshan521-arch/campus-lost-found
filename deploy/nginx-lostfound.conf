# 校园失物招领信息平台 —— Nginx 配置示例
# 使用：拷贝到 /etc/nginx/conf.d/lostfound.conf 后 nginx -t && nginx -s reload

server {
    listen 80;
    server_name lostfound.campus.edu.cn;   # 改成实际域名或内网 IP

    # 校园网内网部署时可限制来源网段
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # deny  all;

    root /var/www/campus-lost-found/web/dist;
    index index.html;

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 上传图片：由后端提供（也可改为 alias 直接指向 instance/uploads）
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
    }

    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/lostfound.access.log;
    error_log  /var/log/nginx/lostfound.error.log;
}
